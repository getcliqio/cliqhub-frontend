<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CliqHub — Build, Run, and Share AI Agent Teams</title>
    <meta name="description" content="Design multi-agent pipelines visually, run them locally with human-in-the-loop review, and publish reusable teams to the registry." />
    <!-- Favicon stack — mirrors getcliq.io so tab / bookmark / home-screen -->
    <!-- icons render identically across browsers. SVG is the primary hint; -->
    <!-- the .ico exists so Safari + legacy Chrome don't fall back to Vite's -->
    <!-- HTML SPA response when they opportunistically fetch /favicon.ico. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" />
    <script>
      /* Paint the saved theme before React mounts, so the first frame is already right.
         Mirrors paint() in src/lib/theme.ts: dark unless the person chose light (or
         "system" on a light OS); sets data-g-theme (Graphite) plus the older `dark`
         class and data-theme. Key: 'cliqhub.theme'. */
      (function () {
        try {
          var raw = localStorage.getItem('cliqhub.theme');
          var light = raw === 'light'
            || (raw === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var theme = light ? 'light' : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-g-theme', theme);
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
        } catch (e) { /* storage blocked: the app paints dark on load */ }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
